# .github/workflows/test.yml
name: Unity test

on:
  push:
    branches: [aula-15-05] 
  pull_request:
    branches: [aula-15-05]    

jobs:
  unit_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        working-directory: ./calculadora_flask   
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes com pytest
        run: |
          pytest

      # Etapa opcional apenas para exibir a referência de tarefa do Jira (ex: CALC-12)
      - name: Mostrar tarefa do Jira (ex: CALC-12)
        run: |
          echo "Verifique se os commits possuem o código da tarefa do Jira (ex: CALC-12)"
