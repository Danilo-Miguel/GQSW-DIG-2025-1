# .github/workflows/test.yml
name: Análise de Qualidade com Pylint

on:
  push:
    branches: [class_preparation_24/04]
  pull_request:

jobs:
  pylint-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Pylint
      working-directory: ./calculadora_flask 
      run: |
        pip install pylint

    - name: Rodar Pylint
      run: |
        pylint calc.py
