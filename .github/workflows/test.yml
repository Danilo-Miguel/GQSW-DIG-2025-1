# .github/workflows/test.yml
name: Análise de Complexidade com Radon

on:
  push:
    branches: [class_preparation_24/04]
  pull_request:

jobs:
  radon-complexity:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Radon
      working-directory: ./calculadora_flask 
      run: |
        pip install radon

    - name: Verificar complexidade ciclomática
      run: |
        radon cc . -s -a
