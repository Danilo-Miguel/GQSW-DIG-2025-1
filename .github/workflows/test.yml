#.github/workflows/test.yml
# This is a basic workflow to help you get started with Actions

name: Unity test

on: 
    push:
        branches: [aula-29-05] 
    pull_request:
        branches: [aula-29-05]    

jobs:
    unit_tests:
        runs-on: ubuntu-latest

        steps:
            - name: Clonar repositório
              uses: actions/checkout@v4

            - name: Configurar Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.10'

            - name: Instalar dependências
              working-directory: ./calculadora_flask   
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            - name: Instalar Chrome e ChromeDriver
              run: |
                sudo apt-get update
                sudo apt-get install -y wget unzip
                wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
                sudo apt install -y ./google-chrome-stable_current_amd64.deb
                CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
                wget -q -O chromedriver.zip https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chromedriver-linux64.zip
                unzip chromedriver.zip
                sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
                sudo chmod +x /usr/local/bin/chromedriver   

            - name: Executar testes com pytest
              run: |
                pytest 

# You can also use the branch name as a trigger